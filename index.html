<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075985">
  <title>Marketer Login | SANYU HOSPITAL</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="login-wrap">
    <section class="app-panel">

      <div class="login-brand">
        <div class="mark">🏥</div>
        <h1>SANYU HOSPITAL</h1>
        <p>Community Marketing Programme</p>
      </div>

      <h2>Marketer sign in</h2>

      <form id="loginForm">
        <div class="app-field">
          <label for="loginEmail">Email address</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="app-field">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="app-btn" type="submit" style="width:100%">
          Sign in
        </button>
      </form>

      <p class="muted" style="text-align:center;margin-top:18px">
        New marketer?
        <a href="create-account.html">Create an account</a>
      </p>

    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
